[workspace]
resolver = "2"
members = ["api", "local", "cloud", "wasm"]

[workspace.package]
version = "0.2.3"
edition = "2024"
repository = "https://github.com/clicksecrets/core"
authors = ["Click Secrets Inc", "Billcountry Mwaniki"]
description = "Click Vault cli allows you to manage secrets locally secured through passkeys for human access and generated private keys for machine access"
homepage = "https://vercel.click"

[package]
name = "click-core"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }

[features]
default = ["trace"]
trace = []
axum = []


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
aes-gcm = { version = "0.11.1", features = ["rand_core"] }
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64 = "0.23.1"
ciborium = { version = "0.2.2" }
chrono = { version = "0.4.45", features = ["serde", "wasm-bindgen"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
http = { version = "1.5.0", default-features = false }
rand = { version = "0.10.2", default-features = false, features = ["chacha", "sys_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["alloc"] }
sha2 = { version = "0.11.0" }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
sqlx = { version = "0.9.0", features = ["macros"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v5", "v7", "js"] }
p256 = "0.14.0"
coset = "0.4.2"
tracing = { version = "0.1.44" }
