[package]
name = "click-cloud"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["tokio", "macros", "json", "query", "ws"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "rustls", "rustls-tls", "tokio1-rustls-tls"] }
click-api = { path = "../api", features = ["cloud"] }
click-core = { path = "..", features = ["axum", "trace"] }
sqlx = { version = "0.9.0", features = ["macros", "chrono", "postgres", "runtime-tokio", "derive", "sqlx-toml", "uuid", "tls-rustls-ring"] }
strum = "0.28.0"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl"] }
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.29.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
