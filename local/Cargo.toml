[package]
name = "secretpass-local"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true


[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["tokio", "macros", "json", "query", "ws"] }
axum-server = { version = "0.9.0", features = ["tls-rustls", "rustls", "tokio-rustls"] }
chrono = { version = "0.4.45", features = ["serde", "now"] }
clap = { version = "4.6.6", features = ["derive"] }
daemon-kit = "0.1.4"
dirs = "7.0.0"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }
secretpass-api = { path = "../api", default-features = false, features = [] }
secretpass-core = { path = "..", features = ["axum", "trace"] }
serde = { version = "1.0.229" }
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }
webbrowser = "1.2.4"
