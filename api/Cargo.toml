[package]
name = "click-api"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true

[features]
cloud = []

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["tokio", "macros", "json", "query"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto", "use_pem"] }
click-core = { path = "..", features = ["trace", "axum"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v7"] }

