[package]
name = "secretpass-api"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true

[features]
email = []
session-maker = []

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["tokio", "macros", "json", "query"] }
chrono = { version = "0.4.45", features = ["serde", "wasm-bindgen"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "rustls", "rustls-tls", "tokio1-rustls-tls"] }
secretpass-core = { path = "..", features = ["trace", "axum"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = { version = "0.10.3" }
reqwest = { version = "0.13.5", features = ["json", "cookies"] }
sqlx = { version = "0.9.0", features = ["chrono", "uuid", "macros"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v7"] }
strum = "0.28.0"

