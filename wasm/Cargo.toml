[package]
name = "secretpass-wasm"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }


[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "wasm-bindgen"] }
serde = { version = "1.0.229", features = ["derive"] }
secretpass-core = { path = "..", default-features = false }
tsify = "0.5.8"
ts-rs = { version = "12.0.1" }
uuid = { version = "1.29.0", features = ["js", "v4", "v7"] }
# This version must be matched with the version installed in CI
wasm-bindgen = { version = "0.2.130" }
wasm-bindgen-futures = "0.4.80"


[dependencies.web-sys]
version = "0.3.105"
features = [
    "CredentialsContainer",
    "Credential",
    "Navigator",
    "Window",
    "CredentialRequestOptions",
    "CredentialCreationOptions",
    "PublicKeyCredential",
    "PublicKeyCredentialCreationOptions",
    "PublicKeyCredentialRpEntity",
    "PublicKeyCredentialUserEntity",
    "PublicKeyCredentialRequestOptions",
    "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "AuthenticationExtensionsClientOutputs",
    "AuthenticationExtensionsClientInputs",
    "AuthenticationExtensionsPrfInputs",
    "AuthenticationExtensionsPrfOutputs",
    "AuthenticationExtensionsPrfValues",
    "UserVerificationRequirement",
    "ResidentKeyRequirement",
    "AuthenticatorSelectionCriteria",
    "AttestationConveyancePreference",
    "AuthenticatorAttachment",
]
