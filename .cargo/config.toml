[build]
rustflags = ["--cfg", "web_sys_unstable_apis"]

[env]
# Used for CORS
UI_ORIGIN = "--bad-origin--"
WEBAUTH_RP_ID = ""
WEBAUTH_RP_ENTITY = ""

CLOUD_PROXY_URL = "http://localhost:8080"
SMTP_USER_NAME = ""
SMTP_TOKEN = ""

CLOUD_RP_ID = "secretpass-cloud.localhost"
CLOUD_RP_ORIGIN = "http://secretpass-cloud.localhost:3002"
LOCAL_RP_ID = "secretpass-local.localhost"
LOCAL_RP_ORIGIN = "http://secretpass-local.localhost:3001"

TS_RS_EXPORT_DIR = { value = "../web-app/src/api-types", relative = true }